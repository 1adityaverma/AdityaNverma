var FILM=`<video class="vf" id="fv" src="silence-can-speak.mp4" controls playsinline preload="none" poster="silence-can-speak-poster.jpg" title="Silence Can Speak"></video><h1>Silence Can Speak.</h1><p>After winning a short film in an intercollegiate, the human vice called “ambition” took over me. And I soon convinced the team to make another one, because it was aching not to. And I learned, passion is contagious. Or to be precise, my passion.</p><p>We shot it in a day inside the campus, skipping our classes and I edited and surprised the team with the final product the next day. We shared it amongst friends, who we thought wouldn’t dismiss the idea of silent black and white, experimental film at the first glance.</p><p>One of them, stating ”What in the Slavic art film is this. Brilliant. It’s about expression. An aura of expression emanates from the character but is invisible to others. The world around him brings it out and because of that in a way sees the inanimate world does see it. Things complement it but nothing reacts to it. Mimesis of colorfulness in black and white.”</p><p>At the end, we were happy. With the fact that something can be done. At least, something.</p>`;

t|And dating apps have not addressed the past or that identity; and have always directed folks to the future, even though past stays heavy, still.

{n:"Concept Brand Formation",sub:"A Concept Makeup Brand: DON’T",L:`t|“DON’T buy our makeup if it makes you feel you are nothing without it.”
t|“Unfortunately for DON’T customers - exercise, diet and sleep before makeup.”
h|Brand Manifesto
t|DON’T is a makeup brand formed on the premises of the philosophy of “negation before addition”. Closer to Advaita Vedanta’s “neti-neti” or modern Nassim Taleb’s “via negativa”—where the more reliable way to reach beauty and truth is firstly by eliminating the wrong than adding what we perceive as good. Hence comes the name “DON’T”, which redirects our attention from unnecessary noise to what’s truly important. To reach, or rather, to uncover our beauty.
t|It promotes the practice of conscious makeup, which is done deliberately and not out of the many psychological insecurities or pressures we humans are so prone to. Conscious, not just in checking ingredient lists, but in our usage practices of it, on our face.
t|We think of makeup as a tool of extension. Not as a transformation that turns a person from ugly to beautiful, but more like a garnish on what’s already beautiful in you, and how it radiates from your face.
t|Therefore, we are strictly light makeup focused. We simply don’t sell heavy makeup.
t|But who defines what’s minimal? Something internal does. We see it every time we push it away when it points us to something true about ourselves. When there is an eerie discomfort we feel about our choices. When we don’t oblige with what we truly want. When we artificially try to feel better in the masks we wear.
t|So when the extra shades start to feel too foreign, you know where you went a step ahead.
t|Our effort is for wearing a mask that doesn’t force you to be what the mask is, but to have control over what you want it to be. And that is where the real individual’s voice shines again. Where, as the popular saying goes, the world is a cinema and you are the star. But in our version, the star is both deeply entrenched in the act but also conscious of her part and acting in it. Never letting the world take away what’s true underneath.
t|Then why no makeup at all?
t|Because we don’t see “thoughtful makeup” as camouflaging, or as self denial. It’s a deliberate showoff. Quite opposite to hiding oneself.
t|Culturally, women have participated in the ritual of self care, but when that self care turns into wanting to be someone else, or a version of you that you are not, that’s where we step back.
t|If we closely look at the word “makeup” itself, the implicit interpretation can seem like it is asking for making up for something lost or something that’s already not there. So we have redefined makeup as “touchup”, which tells you everything you need to know about us. When we say we are touching up, there’s already an underlying layer called our natural face, which allows for a bit of cosmetic sparkle on it. Again quite opposite to the general coined use of touching up, which is more makeup on already done makeup.
t|One last thing. Warning for that matter. It is going to be hard. To choose less. To have more accountability. To see people using anything that reads “beauty” and being on the other side of that conversation. To be more open and less reclusive about your face and how you see yourself. To allow the natural fit of yours to be your own, this time. Truly.
h|Strategy
t|Chosen Problem: The Indian makeup industry or makeup industry as a whole doesn’t address the problems with the western overconsumption framing of beauty. Which leads to dissatisfaction and exacerbated insecurities women continue to feel— even while using the thing that was intended to fix it.
t|Insight: By explicitly telling the truth, bearing the burden of costly signalling and taking the loss on one’s own revenue by not selling heavy makeup, the brand wouldn’t preach what it stands for but will show it. Such a positioning can’t be faked. With almost no brand holding such strong opposing values against the flux of the hyper-consumerist makeup market, addressing that we have been selling insecurities would be an honest word in the pool of “you look bad, you will look better by using…”.
t|Advantage: differentiation in the industry or clean makeup market specifically, is mainly on metrics like ingredients, clean or natural, skin inclusive etc., and the assumption of “more is better” is implicit in top players’ positioning. What looks like direct competition, in the indian context, for clean brands like Minimalist is in fact not, on a fundamental level. Minimalist is built on transparency on the product ingredients side. DON’T differentiates on the psychology of makeup usage itself and on its philosophy.
t|Strategy: the name “DON’T” holds the negation factor, which makes people have an extreme take on it. Not something you can ignore. Either like the philosophy or feel discomfort around it, because it requires redressal of your own values and choices. The brand picks the niche of women who also oppose the heavy makeup narrative and dislike the scrutiny attached to the act of makeup itself. By framing light makeup as literally the right kind of makeup, the brand takes the one sided risk of redefining what beauty is. It can then continue to hold its radical messaging with its new expected momentum and continue its marketing efforts in this same view.`}

{t:"The Kathmandu",u:MS+"outsideyourcomfortzone/",i:"motion-kathmandu.jpg",a:"Night campsite under a tarp, two people by a fire, with the text Home is Outside.",h:`
<p>“Outside, your comfort zone” is such a cool line. I said “wow” when I got the meaning a little later, after first reading it. It carries two meanings:</p>
<ul><li>It shows people that outside (the outdoors) is your comfort zone.</li><li>It gives the more direct, commonly said motivation: get outside your comfort zone.</li></ul>
<span class="lab">My addition</span>
<div class="cp"><small>Copy</small><p>“Home is Outside.”</p></div>
<ul><li>It matches how the films take human experiences that seem indoor and personal, and show them outside.</li><li>On a philosophical level, humans were meant to stay in the natural world more than the artificial one.</li><li>The line itself is ironic.</li></ul>
<span class="lab">Creative direction</span>
<p>The current films first use close-up shots to show the elegance of simple human experiences. Then they show shots of nature, to describe how those same moments, which people usually have inside their houses, look literally in the wild.</p>
<p>My addition is to show this contrast visually. Firstly showing those everyday moments when it seems like the person is inside their house (but really the film is still of the outside— which is portrayed well). Then a surprising transition into the wild.</p>
<p>Current creative direction is rather straight.</p>
<p>Seeing that the person is brushing, reading or sleeping “outside” should come as a surprise. (This would bring in the realisation of “what they currently are” versus “what they could be”.)</p>
<span class="lab">If I were writing purely for the geeks</span>
<p>“Home’s outside.” It shows how the inner self (home) has possession of the outside world, and of course, simply, home is outside.</p>`},

{t:"Karangahape Road",u:MS+"eatit/",i:"motion-karangahape.jpg",a:"Six black-and-white posters with food and kink imagery under the line Smell, bite, chew and swallow.",h:`
<p>The campaign shows kink + food imagery for restaurants, embracing the context of the place. “Eat It” is simple, short and authoritative, and it captures the essence.</p>
<span class="lab">My addition</span>
<p>I might want to go over the top for this one, to capture both smell and taste, and not understate the sensuality that is allowed in both food and kink.</p>
<div class="cp"><small>Copy</small><p>“Smell, bite, chew and swallow.”</p></div>`},

{t:"Griffin’s",u:MS+"life-needs-a-biscuit-/",i:"motion-griffins.jpg",a:"Red billboard reading Kiwis need a, followed by a round biscuit.",h:`
<p>The campaign portrays 24 different films with 24 different moments of normal, everyday life: people in New Zealand eating the biscuits. It is not only simply real, but it also calmly shows an important relationship between biscuits and our lives, which in my experience wasn’t as highlighted.</p>
<p>In India, all the ads were a celebrity endorsing while eating it, or a jingle for kids, or something else I don’t even remember anymore.</p>
<span class="lab">My addition</span>
<p>I feel we are underscoring the potency of community, and a macro-level integration of the biscuit with the whole nation. We are already covering the campaign holistically with people from different walks of life (the 24 different moments) in the country. So why not actually say that too?</p>
<p>The company is also purely New Zealand led. So “life” can be tweaked to “Kiwis”.</p>
<div class="cp"><small>Copy</small><p>“Kiwis need a biscuit.”</p></div>`},

{t:"Heart of the City",u:MS+"straightotheheart/",i:"motion-heart-of-the-city.jpg",a:"Close-up of a taxi roof sign reading Free Taxi, with a screen showing an event, its price per person and time.",h:`
<p>I think the film beautifully captures old-style advertising and the idea of service. It invites the old fun times, and makes spontaneous bystanders, locals and tourists excited to hop on and experience different destinations in the heart of the city.</p>
<span class="lab">My addition</span>
<div class="cp"><small>Copy</small><p>“JOJI. $127-$208 per person. 7PM”</p></div>
<p>A banner highlighting a specific event, on top of the taxi or somewhere else on it.</p>
<p>People don’t visit the city center unless something specific excites or urges them. Money or fare was never an issue in itself, so a free ride alone wouldn’t compel them to go there.</p>
<p>The ask has to be specific, very exciting and unique, and shown to them that day. For example:</p>
<ul><li>an artist coming there</li><li>a specific trade fair</li><li>on normal days, simply an exciting food deal at a particular restaurant.</li></ul>
<p>And of course, the more spontaneous ones can still ride without a destination.</p>
<p>The organisation can decide on some agreement and periodically recommend specific events, with price and details, on the taxi itself. Rather than only being a tour guide.</p>`},

{t:"Les Mills",u:MS+"beimperfect/",i:"motion-les-mills.jpg",a:"Black-and-white photo of a smiling man at a weight bar, with purple text Only the first step, unlocks the second, and white text There is no perfect.",h:`
<p>The cinematography is great. The inner monologue, yes sir. And the insight that perfectionism doesn’t help you by itself is shown well. The intimidation and self-consciousness are real, and countering them allows people to be themselves. “Susshh!” highlights a key tension-releasing moment in the film.</p>
<span class="lab">My addition</span>
<p>I don’t want to dictate what you can or should be. My point is that, your aspiration of being perfect itself is false.</p>
<div class="cp"><small>Copy</small><p>“Only the first step, unlocks the second.”</p><p>“There is no perfect.”</p></div>
<span class="lab">For films</span>
<p>The creative direction would shift. Currently the films show the diverse experiences of normal people. Instead, they would directly show the inner monologue and feelings of the buff folks.</p>
<p>They would show how even the people we aspire to or think are at the top, the regular gym-goers and bros, are in fact struggling just the same. That would make us feel seen.</p>
<span class="lab">My personal taste</span>
<p>I can’t not share this while I’m thinking about the topic: I might want to mock playfully, with lines like “All the fatties, join!” or “Feeling skinny, fellas?”</p>
<p>When all the gyms are either body-positive or buffness-positive, we will be silly! Haha.</p>`}

claude:{t:'An AI that says “I don’t know” wins trust',key:'cp',sk:['Strategy','Copywriting'],m:'g',mf:'real',full:'#cp-0',spec:1,img:'spec-claude.jpg',alt:'Poster for Claude: a couple lying head to head, with the line We know when we don’t.',s:[
S('Problem','In October 2026, ChatGPT drew 55.7% of worldwide generative-AI website traffic and Claude 11.5%, according to Similarweb. Claude needs an edge over ChatGPT without giving away its technical identity.'),
S('Insight','AI confidently hallucinates. Claude is visibly better at saying it doesn’t know. Admitting faults builds trust, whereas constant agreement erodes it.'),
S('Line','“We know when we don’t.” It echoes Socrates’s “I know that I know nothing.”'),
S('Scene','A couple lie in bed after a tense moment.<br><br><b>Girlfriend:</b> “Do you think you get defensive, when we talk…talk about things.”<br><br><b>Boyfriend:</b> “I don’t know…yes I do… I always do… I see myself doing it, too.” Then: “I want to change…learn how to change. And I don’t know how to. Do you?”<br><br><b>Girlfriend:</b> “No.. But let’s try.”<br><br>Out of focus, a laptop glows on a desk. Neither of them looks at it. Sign-off: “Keep thinking.” followed by “Trying.”')]},
chatgpt:{t:'Winners don’t name second winners',key:'cp',sk:['Strategy','Copywriting'],m:'g',mf:'real',full:'#cp-1',spec:1,img:'spec-chatgpt.jpg',alt:'Poster for ChatGPT: a lone photographer on a hill, with the line Your time. Your time isn’t yours.',s:[
S('Problem','As competition and negative narratives around AI intensify, ChatGPT must strengthen its market leadership while protecting the brand’s public perception.'),
S('Insight','Don’t fight the “bad cop” image; build on the company’s mission, “AGI for all people’s benefit.” A leader’s real stance is not addressing competitors at all. Aim at power users: hyper-ambitious people, motivated by mission, who pay and promote organically.'),
S('Line','“Your time isn’t yours.” At first it sounds like a ruler giving orders. It means not slavery to AI, but duty to one’s mission and to society.'),
S('Scene','A black-and-white montage of people working hard, with rock music under it. Narrator: “Your time isn’t yours. It’s for your mission. Mission is time. Your time isn’t yours. It’s for your society.” ChatGPT logo.<br><br>The repeated phrase is a deliberate echo of the “Problem, problem” repetition in Claude’s Keep Thinking film.')]},
hindu:{t:'No uncool that cannot be cooled.',key:'cp',sk:['Strategy','Copywriting'],m:'i',mf:'real',full:'#cp-2',spec:1,pt:1,img:'spec-the-hindu.jpg',alt:'Poster for The Hindu: a man reading a newspaper in a dim hall, with the line Newspapers aren’t cool anymore. Their readers always were.',s:[
S('Problem','Newspapers are seen as an old technology. They take more effort than a phone and are culturally seen as outdated.'),
S('Insight','People like to associate with cool, aesthetic things. We associate newspapers with uncles, so if the uncle becomes cool, that transfers to The Hindu. Most newspaper brands compete on reliability and trust. The Hindu already owns quality, so it can take the aesthetic of reading a newspaper too.'),
S('Line','“Newspapers aren’t cool anymore. Their readers always were.”'),
S('Scene (Film 1, Hindi)','Kids tell an uncle hiding behind a newspaper to check the news on his phone instead. The paper moves aside: lungi, shirt, sunglasses, tea. Uncle: “Beta… when has depth not been cool?” An Instagram-style fan edit of him plays. A kid asks, “Uncle, aap theek toh ho na?”<br><br>Film 2 (newspaper-cutting art) and Film 3 (the uncle on a date) continue the story.')]},
hinge:{t:'Long form storytelling for a dating app.',key:'cp',sk:['Strategy','Copywriting'],m:'u',mf:'real',full:'#cp-3',spec:1,img:'spec-hinge.jpg',alt:'Poster for Hinge: a smiling woman in a black-and-white double exposure of a street festival.',s:[
S('Problem','According to SSRS (2026), the share of US adults currently using dating apps fell from 7% in 2025 to 6% in January 2026.'),
S('Insight','I have no numbers for this, only observation: many people on dating apps have already had a breakup or an infatuation. Apps point only to the future, though the past stays heavy. A mild melancholy can show love as a continuous chain rather than cuts, and speak to what neither person on a date says aloud.'),
S('Line','“See me in everyone and know that I am happy for you.” The first half is love continuing. The second half is an assurance of well-being, as if to an ex.'),
S('Scene','Chloe, back from a trip with friends, reads a letter in voice-over over photos of the trip. It opens: “Did we die? We didn’t. We both know it.” It closes: “Know that I see you in everyone and I know that you are happy for me.” Her friends start reading it too. Hinge logo.')]},
airbnb:{t:'Why photos beat 5-star reviews on Airbnb Experiences',key:'o',sk:['Business analysis'],m:'i',mf:'real',full:'#o-0',fit:1,img:'airbnb-cooking-photos.jpg',alt:'Foreign guests cooking and eating with a Delhi host. Courtesy @explorerealindia.',s:[
S('What I did','A product teardown of Airbnb Experiences, a vertical inside the lodging business that gives existing guests more to book. The core user is a foreign tourist staying in Delhi or Gurugram. I looked at friends travelling together and split them by how they book: the deliberate planner, the intuitive selector and the impulse adventurer.'),
S('What I found','I walked through choosing a home-cooking host near Delhi, as a foreigner would. Clear, high-quality photos of earlier foreign guests win the first impression. They suggest no language barrier, safety and cultural understanding. Written reviews only confirm that trust, and almost every host has 5 stars, often given out of courtesy.'),
S('What I’d do next','<ul><li>Offer stay and experience as one discounted package.</li><li>Train good hosts, and give them exclusive deals in return.</li><li>Let guests rate language and cultural knowledge separately.</li><li>Add video reviews, so safety is easier to verify.</li></ul>The main metric would be total Experience bookings, with user ratings as the quality check.')]},
zomato:{t:'Five interviews, one problem: life after you hit order',key:'o',sk:['Research'],m:'i',mf:'real',full:'#o-1',fit:1,img:'zomato-empathy-map.jpg',alt:'Empathy map from one Zomato interview: says, thinks, does, feels.',s:[
S('What I did','Five one-hour, one-on-one interviews with students and early-career professionals. For the first 80% of each, I let the person lead and tell their own stories. Only at the end did I show the idea I was testing: a faster Zomato checkout that skips the home page, with an opt-out.'),
S('What I found','All four active users raised delivery problems without being asked: the app not showing where the order is, drivers and restaurants not doing what they promised, and poor coordination between all three. Chatbots gave false reassurance. One person said: “8 out of every 15–16 orders I place are frustrating.” The fifth person doesn’t order online at all, because of price, family habit and never having started.<br><br>The quick-checkout idea got a hesitant yes from almost everyone.'),
S('What I’d do next','Test it with real users in a narrower group first. Zomato can’t fix drivers directly, but clearer updates after the order can still ease the worry people feel.')]},
dont:{t:'A makeup brand that wins by selling less',key:'o',sk:['Brand'],m:'i',mf:'own',full:'#o-2',img:'dont-billboard.jpg',alt:'DON’T jar billboard at Pennsylvania Station.',s:[
S('Problem','The makeup industry doesn’t address the western overconsumption framing of beauty. Women end up with more insecurity, even while using the product meant to fix it.'),
S('Insight','A brand that takes the loss by not selling heavy makeup doesn’t preach its values, it shows them. That position can’t be faked. Clean brands like Minimalist differentiate on ingredients. DON’T differentiates on the psychology of using makeup and on its philosophy.'),
S('Idea','“Negation before addition,” close to Advaita Vedanta’s “neti-neti” and Taleb’s “via negativa”: remove the wrong before adding what we think is good. Makeup becomes a “touchup” on what is already beautiful in you, not a transformation. The name makes people take a side, which is the point, since it asks them to look at their own choices.'),
S('Lines','<ul><li>“DON’T buy our makeup if it makes you feel you are nothing without it.”</li><li>“Unfortunately for DON’T customers: exercise, diet and sleep before makeup.”</li></ul>')]}

 return c.f?'<div class="cd fc" style="--c:'+col+'" role="button" tabindex="0" aria-label="Play Silence Can Speak">'+inner+'</div>':'<a class="cd" style="--c:'+col+'" href="'+c.href+'">'+inner+'</a>'}
function rt(it){var w=String(it.L||'').replace(/\b[a-z]\|/g,' ').split(/\s+/).filter(Boolean).length;return Math.max(1,Math.round(w/200))+' min'}
function allCards(){var c=SPK.map(function(k,x){var p=SP[k],cs=x<4;return {href:cs?'#cp-'+x:'#s-'+k,img:p.ci||p.img,t:p.t,sk:p.sk,tm:cs?rt(D.cp[x]):'1 min',m:ML[p.m],w:p.mf=='own'?'Own':'Spec',ty:['claude','chatgpt','hindu','hinge'].indexOf(k)>=0?'Case studies':'Ideas'}});
 c.push({f:1,img:'silence-can-speak-poster.jpg',t:'Silence Can Speak',sk:['Film'],tm:'4:47',m:'Global',w:'Own',ty:'Ideas'});
 CMP.forEach(function(m,i){c.push({href:'#out-motion-'+i,img:m[2],t:'“'+m[1]+'”',by:m[0]+' campaign by Motion Sickness',sk:['Copywriting'],tm:'10 secs',m:'Global',w:'Spec',ty:'Ideas'})});
 return c}
function cardsHTML(){var o=allCards().filter(function(c){return !FIL.length||FIL.indexOf(c.ty)>=0});
 return o.length?o.map(card).join(''):'<p>Nothing matches this filter.</p>'}
function chipsHTML(){return GRP.map(function(g){return '<div class="gp"><h4>'+g[0]+'</h4>'+g[1].map(function(v){return '<button type="button" class="fb" data-v="'+v+'" aria-pressed="'+(FIL.indexOf(v)>=0)+'" style="--c:'+CLR[v]+'"><i></i>'+v+'</button>'}).join('')+'</div>'}).join('')}
function profHTML(c){return '<div class="ab '+c+'"><div class="av"><img src="me.jpg" alt="Aditya Verma"></div><div class="pt"><p>99%ile CUET, Delhi University</p><p>Product intern at a VC-backed startup</p><p>1st inter college film</p></div><button type="button" class="tm2" data-open="1">Tell me more →</button></div>'}
function homeHTML(){return '<div id="cards"></div>'+profHTML('pfm')}
function fillCards(){var el=$('#cards');if(!el)return;var a=allCards().filter(function(c){return !FIL.length||FIL.indexOf(c.ty)>=0}).map(card);
 if(!a.length){el.innerHTML='<p>Nothing matches this filter.</p>';return}
 var n=Math.max(1,Math.floor((el.clientWidth+26)/316)),cols=[],i;for(i=0;i<n;i++)cols.push('');a.forEach(function(h,j){cols[j%n]+=h});
 el.innerHTML=cols.map(function(c){return '<div class="col">'+c+'</div>'}).join('')}
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(main.classList.contains('hm'))fillCards()},120)});
function openMd(){var b=['#0b1f4d','#4c1d95','#b0102f','#000'],t=['<b>Creative Direction, copy and strategy</b>'];
 var m=$('#md');m.innerHTML='<div class="mc" role="dialog" aria-modal="true" aria-label="About Aditya"><div class="mh">Aditya Verma</div><div class="mav"><img src="me.jpg" alt="Aditya Verma"></div><button class="mx" type="button" aria-label="Close">×</button><div class="mb"><p class="m1">Netting ideas teams can’t find. Denetting what they can. could.</p><p class="m2">Wanna take advantage of this awesome cheap labour?</p><form id="hi" class="hf"><input type="email" required placeholder="Your email" aria-label="Your email"><button type="submit">Awkward hi</button></form><p class="hn" role="status"></p><p class="m3">(If you don’t like an empty <img class="hi" src="hi.png" alt="Hi">, firstly, why so? Secondly, take the trouble to write me “what you want out of me” at the <a href="mailto:adityavermaworkid@gmail.com">email</a>.)</p></div>'+t.map(function(x,i){return '<div class="bn" style="background:'+b[i]+'">'+x+'</div>'}).join('')+'</div>';m.hidden=false;m.querySelector('.mx').focus()}
function closeMd(){$('#md').hidden=true}
var main=$('#main'),sb=$('#sb'),app=$('#app'),cur=null;
function lk(x){return '<div class="lk">'+x+'</div>'}
function route(h){
 if(typeof h!="string")h=(location.hash||"").slice(1);
 if(h===cur)return;cur=h;
 var m=/^(cp|o)-(\d+)$/.exec(h),sec=m&&m[1],i=m?+m[2]:-1,it=sec&&D[sec][i],sm=/^s-([a-z]+)$/.exec(h),sp=sm&&SP[sm[1]],mo=/^out-motion(?:-(\d))?$/.exec(h),films=h=="films",html,title="Aditya Verma",cls="",ns=false;
 if(it){
  html="<h1>"+esc(it.n)+"</h1>"+(it.sub?'<p class="sub">'+esc(it.sub)+"</p>":"")+(it.m?'<span class="tag">'+(it.m=="i"?CHAKRA+"Indian market":it.m=="u"?GLOBE+"US market":GLOBE+"Global market")+"</span>":'<div style="height:24px"></div>')+lines(it.L);
  title=it.n+" — Aditya Verma";cls=" doc"+(/(^|\n)f\|/.test(it.L)?" pz":"")+(/g\|/.test(it.L)?" wide":"");
  sb.innerHTML=lk('<a href="#">← All work</a>'+D[sec].map(function(p,j){return '<a href="#'+sec+"-"+j+'"'+(j==i?' class="on" aria-current="page"':"")+">"+esc(p.n)+"</a>"}).join(""))
 }else if(sp){html=spHTML(sm[1]);title=sp.t+" — Aditya Verma";cls=" doc pz";sb.innerHTML=lk(spSide(sm[1]))}
 else if(films){html=FILM;title="Short films — Aditya Verma";cls=" doc wide";sb.innerHTML=lk('<a href="#">← All work</a><a href="#films" class="on">Silence Can Speak</a>')}
 else if(mo){html='<p><a href="#">← All work</a></p>'+MOTION;title="Motion Sickness — Aditya Verma";cls=" wide";ns=true}
 else{html=homeHTML();cls=" hm";sb.innerHTML=chipsHTML()+profHTML('pfd')}
 app.className=ns?"ns":"";main.className="main"+cls;main.innerHTML=html;if(cls==" hm")fillCards();document.title=title;
 window.scrollTo(0,0);
 stopPen();var pw=main.querySelector(".ow");if(pw)startPen(pw,motionPts,true);
 if(mo&&mo[1]!=null){var el=main.querySelectorAll(".oc")[+mo[1]];if(el)setTimeout(function(){window.scrollTo(0,el.getBoundingClientRect().top+window.scrollY-24)},60)}
 initDecks()}
function go(h){try{location.hash=h}catch(e){}route(h)}
function refresh(){sb.innerHTML=chipsHTML()+profHTML('pfd');fillCards()}
function playFilm(f){if(f.querySelector('video'))return;f.style.height=f.offsetHeight+'px';f.removeAttribute('role');f.innerHTML='<video src="silence-can-speak.mp4" poster="silence-can-speak-poster.jpg" controls autoplay playsinline title="Silence Can Speak"></video><a class="rd" href="#films">Read the story →</a>'}
document.addEventListener("click",function(e){var t=e.target,c=t.closest?t.closest.bind(t):function(){return null};
 if(t.id=="md"||c('.mx')){closeMd();return}
 var b=c('.fb');if(b){var v=b.dataset.v,i=FIL.indexOf(v);if(i<0)FIL.push(v);else FIL.splice(i,1);refresh();return}
 if(c('[data-open]')){openMd();return}
 var ra=c('a.rd');if(ra){e.preventDefault();go('films');return}
 var f=c('.fc');if(f){playFilm(f);return}
 var a=c('a[href^="#"]');if(a){e.preventDefault();go(a.getAttribute("href").slice(1))}});
document.addEventListener("keydown",function(e){if(e.key=="Escape")closeMd();var f=e.target.classList&&e.target.classList.contains('fc')&&e.target;if(f&&(e.key=="Enter"||e.key==" ")){e.preventDefault();playFilm(f)}});

var FORM_ENDPOINT='';
document.addEventListener('submit',function(e){var f=e.target;if(f.id!='hi')return;e.preventDefault();var inp=f.querySelector('input'),em=inp.value.trim(),btn=f.querySelector('button'),note=f.parentNode.querySelector('.hn');
 if(!FORM_ENDPOINT){location.href='mailto:adityavermaworkid@gmail.com?subject=Hi&body='+encodeURIComponent('Awkward hi.\n\nMy email: '+em);return}
 btn.disabled=true;fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({email:em,message:'Awkward hi'})}).then(function(r){if(!r.ok)throw 0;note.textContent='Sent.';inp.value=''}).catch(function(){note.textContent='Didn’t send. Try again?'}).then(function(){btn.disabled=false})});
window.addEventListener("hashchange",function(){route()});
route();
</script></body></html>
